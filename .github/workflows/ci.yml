name: CI

on:
  # Both branches are listed because this repository's default branch is
  # `master`, while `main` is the conventional default used by some forks and
  # new checkouts. Listing only `main` meant pushes to the actual working
  # branch ran no checks at all.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
